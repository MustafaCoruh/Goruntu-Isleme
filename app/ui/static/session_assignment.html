<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aktif Uçuş Testi Masa Atama</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f4f7fb; color: #102a43; }
    header { background: #0b69a3; color: white; padding: 24px; }
    main { max-width: 1180px; margin: 0 auto; padding: 24px; }
    section { background: white; border-radius: 14px; box-shadow: 0 8px 24px rgba(16,42,67,.08); margin-bottom: 20px; padding: 20px; }
    h1, h2 { margin-top: 0; }
    .meta-grid, .table-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
    .meta, .table-card { border: 1px solid #d9e2ec; border-radius: 10px; padding: 12px; background: #f8fbff; }
    .label { color: #627d98; font-size: .85rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid #d9e2ec; padding: 10px; text-align: left; vertical-align: middle; }
    th { color: #486581; font-size: .85rem; }
    select, button { border: 1px solid #bcccdc; border-radius: 8px; padding: 8px; }
    button { background: #0b69a3; color: white; cursor: pointer; }
    button:disabled { background: #9fb3c8; cursor: not-allowed; }
    .status { margin-bottom: 12px; color: #486581; }
    .badge { display: inline-block; border-radius: 999px; padding: 3px 9px; font-size: .8rem; background: #e0f2fe; color: #075985; }
    .occupied { background: #fee2e2; color: #991b1b; }
    .empty { background: #dcfce7; color: #166534; }
    .unknown, .uncertain { background: #fef3c7; color: #92400e; }
  </style>
</head>
<body>
  <header>
    <h1>Aktif Uçuş Testi Masa Atama</h1>
    <p>Operatör katılımcıları masalara manuel olarak atar; atama zamanı ve kaynağı kaydedilir.</p>
  </header>
  <main>
    <p id="status" class="status">Yükleniyor...</p>

    <section aria-labelledby="session-title">
      <h2 id="session-title">Aktif oturum</h2>
      <div id="session" class="meta-grid"></div>
    </section>

    <section aria-labelledby="tables-title">
      <h2 id="tables-title">Masa listesi ve doluluk</h2>
      <div id="tables" class="table-grid"></div>
    </section>

    <section aria-labelledby="participants-title">
      <h2 id="participants-title">Katılımcı listesi</h2>
      <table>
        <thead>
          <tr>
            <th>Katılımcı</th>
            <th>Rol / Kurum</th>
            <th>Atanan masa</th>
            <th>Atama zamanı</th>
            <th>Kaynak</th>
            <th>İşlem</th>
          </tr>
        </thead>
        <tbody id="participants"></tbody>
      </table>
    </section>
  </main>

  <script>
    const state = { tables: [], participants: [] };
    const statusEl = document.querySelector('#status');
    const sessionEl = document.querySelector('#session');
    const tablesEl = document.querySelector('#tables');
    const participantsEl = document.querySelector('#participants');

    const text = (value) => value ?? '-';
    const formatDate = (value) => value ? new Date(value).toLocaleString('tr-TR') : '-';

    async function loadState() {
      statusEl.textContent = 'Yükleniyor...';
      const response = await fetch('/sessions/active/assignment');
      if (!response.ok) throw new Error(await response.text());
      const data = await response.json();
      state.tables = data.tables ?? [];
      state.participants = data.participants ?? [];
      renderSession(data.session);
      renderTables();
      renderParticipants();
      statusEl.textContent = 'Güncel veriler yüklendi.';
    }

    function renderSession(session) {
      const flight = session.flight_test ?? {};
      sessionEl.innerHTML = `
        <div class="meta"><div class="label">Test</div><strong>${text(flight.test_name)}</strong></div>
        <div class="meta"><div class="label">Uçak</div><strong>${text(flight.aircraft_name)}</strong></div>
        <div class="meta"><div class="label">Test No</div><strong>${text(flight.test_number)}</strong></div>
        <div class="meta"><div class="label">UTYM</div><strong>${text(session.utym_name)}</strong></div>
        <div class="meta"><div class="label">Oturum durumu</div><strong>${text(session.status)}</strong></div>
        <div class="meta"><div class="label">Başlangıç</div><strong>${formatDate(session.start_time)}</strong></div>`;
    }

    function renderTables() {
      tablesEl.innerHTML = state.tables.map((table) => `
        <article class="table-card">
          <h3>${text(table.name)}</h3>
          <p><span class="badge ${table.occupancy_status}">${text(table.occupancy_status)}</span></p>
          <p>Kapasite: <strong>${table.capacity}</strong></p>
          <p>Atanan: <strong>${table.assigned_count}</strong></p>
          <p>Son algılama: ${formatDate(table.last_detected_at)}</p>
        </article>`).join('') || '<p>Tanımlı masa yok.</p>';
    }

    function renderParticipants() {
      participantsEl.innerHTML = state.participants.map((participant) => `
        <tr>
          <td><strong>${text(participant.full_name)}</strong></td>
          <td>${text(participant.role)} / ${text(participant.organization)}</td>
          <td>${text(participant.assigned_table_name)}</td>
          <td>${formatDate(participant.assigned_at)}</td>
          <td>${text(participant.assignment_source)}</td>
          <td>
            <select id="table-${participant.session_participant_id}">
              <option value="">Masa seç</option>
              ${state.tables.map((table) => `<option value="${table.id}" ${participant.assigned_table_id === table.id ? 'selected' : ''}>${table.name}</option>`).join('')}
            </select>
            <button type="button" onclick="assignParticipant(${participant.session_participant_id})">Ata</button>
          </td>
        </tr>`).join('') || '<tr><td colspan="6">Katılımcı yok.</td></tr>';
    }

    async function assignParticipant(sessionParticipantId) {
      const select = document.querySelector(`#table-${sessionParticipantId}`);
      if (!select.value) { statusEl.textContent = 'Lütfen bir masa seçin.'; return; }
      statusEl.textContent = 'Atama kaydediliyor...';
      const response = await fetch(`/sessions/active/participants/${sessionParticipantId}/assignment`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ table_id: Number(select.value) })
      });
      if (!response.ok) { statusEl.textContent = `Atama başarısız: ${await response.text()}`; return; }
      await loadState();
      statusEl.textContent = 'Manuel atama kaydedildi.';
    }

    loadState().catch((error) => { statusEl.textContent = `Veri alınamadı: ${error.message}`; });
  </script>
</body>
</html>
